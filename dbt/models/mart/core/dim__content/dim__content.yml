version: 2

models:
  # =============================================================================
  # dim_content : Content dimension table for star schema
  # =============================================================================
  - name: dim__content
    description: |-
      Content dimension table containing information about programs available on BigMedia.
      
      This dimension is part of the star schema and will be joined to the fact table
      fct_viewings via the content_fk foreign key.
      
    columns:
      - name: content_sk
        description: "Surrogate key for content dimension (primary key)"
        tests:
          - unique
          - not_null
          
      - name: content_id
        description: "Business key - unique content identifier"
        tests:
          - unique
          - not_null
          
      - name: title
        description: "Full title of the episode or movie"
        tests:
          - not_null
          
          
      - name: season_number
        description: "Season number (1, 2, 3...)"
        tests:
          - not_null
          
      - name: episode_number
        description: "Episode number within the season"
        tests:
          - not_null
          
              
      - name: release_date
        description: "First release date of the content"
        tests:
          - not_null

      - name: release_year
        description: "Year of content release (extracted from release_date)"
        tests:
          - not_null

      - name: duration_minutes
        description: "Content duration in minutes"
        tests:
          - not_null

      - name: production_cost_euros
        description: "Production cost in euros"
        tests:
          - not_null
