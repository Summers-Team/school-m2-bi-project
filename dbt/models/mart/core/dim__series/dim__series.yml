version: 2

models:
  # =============================================================================
  # dim_series : Series dimension table for star schema
  # =============================================================================
  - name: dim__series
    description: |-
      Series dimension table containing information about series available on BigMedia.
      
      This dimension is part of the star schema and will be joined to the fact table
      fct_viewings via the series_fk foreign key.
      
    columns:
      - name: series_sk
        description: "Surrogate key for series dimension (primary key)"
        tests:
          - unique
          - not_null
          
      - name: series_name
        description: "Parent series name"
        tests:
          - not_null
          
      - name: genre
        description: "Main content genre"
        tests:
          - not_null
          - accepted_values:
              values: ['Action', 'Aventure', 'Comédie', 'Éducatif', 'Science-Fiction', 'Fantaisie', 'Documentaire']
              
      - name: target_age_group
        description: "Target age group for the content"
        tests:
          - not_null
              
      - name: production_type
        description: "Production type (Original BigMedia or External Purchase)"
        tests:
          - not_null
          - accepted_values:
              values: ['Original BigMedia', 'Achat']

      - name: first_release_year
        description: "Year of the first release of the series"
        tests:
          - not_null

      - name: total_seasons
        description: "Total number of seasons in the series"
        tests:
          - not_null
      - name: total_episodes
        description: "Total number of episodes in the series"
        tests:
          - not_null

          