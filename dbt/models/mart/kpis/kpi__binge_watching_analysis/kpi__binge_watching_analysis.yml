version: 2

models:
  # =============================================================================
  # kpi_binge_watching_analysis : Binge-watching analysis by series
  # =============================================================================
  - name: kpi_binge_watching_analysis
    description: |
      KPI analyzing binge-watching behavior (users watching multiple episodes in a day).
      
      A binge-watcher is defined as a user who watches 3 or more episodes of the same
      series on the same day. This retention metric helps understand viewer engagement.
      
    columns:

      - name: content_id
        description: "Unique content identifier (ex: 'fishbowl_wives_s01e02' for the series_name 'Fishbowl Wives')"

      - name: series_name
        description: "Series name"
        
      - name: binge_watchers_count
        description: "Number of users who watched 3+ episodes in a day"
        
      - name: total_viewers
        description: "Total number of unique viewers for the series"
        


