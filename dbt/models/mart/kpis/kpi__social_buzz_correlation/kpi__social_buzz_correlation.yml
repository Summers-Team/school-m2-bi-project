version: 2

models:
  # =============================================================================
  # kpi_social_buzz_correlation : Correlation between social buzz and views
  # =============================================================================
  - name: kpi_social_buzz_correlation
    description: |
      KPI showing the correlation between social media buzz (mentions, likes, shares)
      and the number of views for each program.
      
      This metric helps understand if social media engagement drives viewership.
      
    columns:
      - name: content_title
        description: "Content title (matched between social media and viewing data)"
        
      - name: total_mentions
        description: "Total number of social media mentions"
        
      - name: total_likes
        description: "Total number of likes on social media mentions"
        
      - name: total_shares
        description: "Total number of shares on social media mentions"
        
      - name: avg_likes_per_mention
        description: "Average likes per mention"
        
      - name: total_views
        description: "Total number of views"
        
      - name: unique_viewers
        description: "Number of unique viewers"
        
      - name: total_viewing_hours
        description: "Total viewing hours"

