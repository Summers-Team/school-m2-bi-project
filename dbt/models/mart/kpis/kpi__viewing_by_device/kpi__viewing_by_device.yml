version: 2

models:
  # =============================================================================
  # kpi_viewing_by_device : Viewing distribution by device type
  # =============================================================================
  - name: kpi_viewing_by_device
    description: |
      KPI showing the distribution of viewings by device type and operating system.
      
      This metric helps optimize the user experience by understanding which
      platforms are most used for viewing.
      
    columns:
      - name: device_type
        description: "Type of device"
        
      - name: os
        description: "Operating system"
        
      - name: total_views
        description: "Total number of views on this device/os combination"
        
      - name: unique_viewers
        description: "Number of unique viewers on this device/os"
        
      - name: total_viewing_hours
        description: "Total viewing hours on this device/os"
        
      - name: avg_completion_rate
        description: "Average completion rate on this device/os"
        
      - name: views_percentage
        description: "Percentage of total views on this device/os"

