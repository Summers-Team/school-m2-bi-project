version: 2

models:
  # =============================================================================
  # kpi_top_programs : Top 10 most viewed programs
  # =============================================================================
  - name: kpi_top_programs
    description: |
      KPI showing the top 10 programs ranked by total views, unique viewers, and viewing hours.
      
      This metric helps the Programming Direction identify the most popular content
      and understand what resonates with the audience.
      
    columns:
      - name: content_id
        description: "Content identifier"
        
      - name: title
        description: "Program title"
        
      - name: series_name
        description: "Series name"
        
      - name: genre
        description: "Content genre"
        tests:
        - accepted_values:
              values: ['Action', 'Aventure', 'Comédie', 'Éducatif', 'Science-Fiction', 'Fantaisie', 'Documentaire']
        
      - name: production_type
        description: "Production type"
        
      - name: total_views
        description: "Total number of views"
        
      - name: unique_viewers
        description: "Number of unique viewers"
        
      - name: total_viewing_hours
        description: "Total viewing hours"
        
      - name: avg_completion_rate
        description: "Average completion rate"
        
      - name: rank_by_views
        description: "Rank by total views (1-10)"
        
      - name: rank_by_viewers
        description: "Rank by unique viewers"
        
      - name: rank_by_hours
        description: "Rank by viewing hours"

