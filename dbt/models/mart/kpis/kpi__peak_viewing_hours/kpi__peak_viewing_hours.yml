version: 2

models:
  # =============================================================================
  # kpi_peak_viewing_hours : Peak viewing hours analysis
  # =============================================================================
  - name: kpi_peak_viewing_hours
    description: |
      KPI showing viewing patterns by hour of day and day of week.
      
      This metric helps the Programming Direction decide when to launch new episodes
      by identifying peak viewing hours.
      
    columns:
      - name: viewing_hour
        description: "Hour of day (0-23)"
        
      - name: day_of_week
        description: "Day of week name"
        
      - name: total_views
        description: "Total number of views at this hour/day combination"
        
      - name: unique_viewers
        description: "Number of unique viewers at this hour/day"
        
      - name: total_viewing_hours
        description: "Total viewing hours at this hour/day"

