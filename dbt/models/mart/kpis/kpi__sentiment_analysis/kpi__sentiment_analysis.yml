version: 2

models:
  # =============================================================================
  # kpi_sentiment_analysis : Sentiment analysis for original productions
  # =============================================================================
  - name: kpi_sentiment_analysis
    description: |
      KPI showing sentiment analysis scores for original BigMedia productions based
      on social media mentions.
      
      Sentiment is calculated using keyword matching (positive: "ador", "super",
      "incroyable", etc.; negative: "déçu", "nul", etc.). This is a simplified
      approach for testing purposes.
      
    columns:
      - name: content_title_mentioned
        description: "Content title mentioned in social media"
        
      - name: total_mentions
        description: "Total number of mentions"
        
      - name: avg_sentiment_score
        description: "Average sentiment score (-1.0 to 1.0)"
        
      - name: positive_mentions
        description: "Number of positive mentions"
        
      - name: negative_mentions
        description: "Number of negative mentions"
        
      - name: neutral_mentions
        description: "Number of neutral mentions"
        
      - name: positive_rate
        description: "Percentage of positive mentions"
        
      - name: negative_rate
        description: "Percentage of negative mentions"

