version: 2

models:
  # =============================================================================
  # kpi_completion_rate_by_series : Average completion rate by series and genre
  # =============================================================================
  - name: kpi_completion_rate_by_series
    description: |
      KPI showing the average completion rate by series and genre.
      
      This retention metric helps the Programming Direction understand which
      series keep viewers engaged until the end.
      
    columns:
      - name: series_name
        description: "Series name"
        
      - name: genre
        description: "Content genre"
        tests:
        - accepted_values:
              values: ['Action', 'Aventure', 'Comédie', 'Éducatif', 'Science-Fiction', 'Fantaisie', 'Documentaire']
        
      - name: total_views
        description: "Total number of views"
        
      - name: avg_completion_rate
        description: "Average completion rate (0.0 to 1.0)"
        
      - name: completed_views
        description: "Number of completed views (>= 90%)"
        
      - name: completion_percentage
        description: "Percentage of views that were completed"

