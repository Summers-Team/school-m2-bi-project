version: 2

models:
  # =============================================================================
  # kpi_originals_vs_acquired : Comparison of Original BigMedia vs Achat performance
  # =============================================================================
  - name: kpi_originals_vs_acquired
    description: |
      KPI comparing Original BigMedia productions vs Acquired content on all audience
      and retention metrics.
      
      This is the key metric for the Production Direction to justify investment
      in original content.
      
    columns:
      - name: production_type
        description: "Production type (Original BigMedia or Achat)"
        
      - name: total_views
        description: "Total number of views"
        
      - name: unique_viewers
        description: "Number of unique viewers"
        
      - name: total_viewing_hours
        description: "Total viewing hours"
        
      - name: avg_completion_rate
        description: "Average completion rate"
        
      - name: completed_views
        description: "Number of completed views (>= 90%)"
        
      - name: completion_percentage
        description: "Percentage of views that were completed"

