version: 2

models:
  # =============================================================================
  # kpi_unique_viewers_by_program : Unique viewers count by program and genre
  # =============================================================================
  - name: kpi_unique_viewers_by_program
    description: |
      KPI showing the number of unique viewers per program, broken down by genre.
      
      This metric helps the Programming Direction understand which programs
      attract the most unique audience.
      
    columns:
      - name: content_id
        description: "Content identifier"
        
      - name: title
        description: "Program title"
        
      - name: genre
        description: "Content genre"
        
      - name: unique_viewers_count
        description: "Number of unique viewers who watched this program"

