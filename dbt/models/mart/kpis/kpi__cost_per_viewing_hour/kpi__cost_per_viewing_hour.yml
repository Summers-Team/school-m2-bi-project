version: 2

models:
  # =============================================================================
  # kpi_cost_per_viewing_hour : Cost per viewing hour for original productions
  # =============================================================================
  - name: kpi_cost_per_viewing_hour
    description: |
      KPI showing the cost per viewing hour for each original BigMedia production.
      
      This metric helps the Production Direction understand the ROI of original
      content investments.
      
    columns:
      - name: content_id
        description: "Content identifier"
        
      - name: title
        description: "Program title"
        
      - name: production_cost_euros
        description: "Production cost in euros"
        
      - name: total_viewing_hours
        description: "Total viewing hours for this content"
        
      - name: cost_per_viewing_hour
        description: "Cost per viewing hour (production_cost_euros / total_viewing_hours)"

