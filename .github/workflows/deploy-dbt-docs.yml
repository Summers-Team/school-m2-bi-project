name: Deploy dbt Docs to GitHub Pages

# This workflow generates dbt documentation and deploys it to GitHub Pages
# 
# Setup Required:
# 1. Go to repository Settings > Pages
# 2. Under "Build and deployment", set Source to "GitHub Actions"
# 3. For more details, see .github/GITHUB_PAGES_SETUP.md
#
# The workflow runs automatically on:
# - Push to main branch
# - Manual trigger via workflow_dispatch

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync

      - name: Generate dbt docs
        run: |
          cd dbt
          # Create a minimal profiles.yml for docs generation (no connection needed)
          cat > profiles.yml << EOF
          projet_m2_bi:
            outputs:
              docs:
                type: bigquery
                method: oauth
                project: dummy-project
                dataset: dummy_dataset
                threads: 1
                location: US
            target: docs
          EOF
          # Parse the project first
          uv run --project .. dbt parse --profiles-dir .
          # Generate documentation without catalog (no database connection required)
          uv run --project .. dbt docs generate --profiles-dir . --empty-catalog --no-compile
        continue-on-error: false

      - name: Prepare docs for GitHub Pages
        run: |
          mkdir -p gh-pages
          cp -r dbt/target/* gh-pages/
          # Create index.html redirect to the dbt docs
          cat > gh-pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>dbt Documentation</title>
            <meta http-equiv="refresh" content="0; url=./index.html">
            <link rel="canonical" href="./index.html">
          </head>
          <body>
            <p>Redirecting to <a href="./index.html">dbt documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'gh-pages'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
