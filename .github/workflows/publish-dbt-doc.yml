name: Deploy dbt doc to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permet de déclencher manuellement le workflow

permissions:
  contents: read
  pages: write
  id-token: write

# Empêche plusieurs déploiements simultanés
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.DBT_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          cleanup_credentials: true
      
      - name: Configure dbt profiles
        run: |
          cd dbt
          # Extract profile name from dbt_project.yml using Python (available from previous step)
          DBT_PROFILE=$(python -c "import yaml; print(yaml.safe_load(open('dbt_project.yml'))['profile'])")
          
          cat > profiles.yml <<EOF
          $DBT_PROFILE:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: ${{ secrets.GCP_DEV_DATASET }}
                keyfile: ${{ steps.auth.outputs.credentials_file_path }}
                threads: 4
                location: ${{ secrets.GCP_REGION }}
              prod:
                type: bigquery
                method: service-account
                project: ${{ secrets.GCP_PROJECT_ID }}
                dataset: ${{ secrets.GCP_PROD_DATASET }}
                keyfile: ${{ steps.auth.outputs.credentials_file_path }}
                threads: 8
                location: ${{ secrets.GCP_REGION }}
          EOF
      
      - name: Install dbt packages
        run: |
          cd dbt
          dbt deps
      
      - name: Generate dbt documentation
        run: |
          cd dbt
          dbt docs generate --profiles-dir . --target dev

      - name: Generate ERD (Mermaid format)
        run: |
          cd dbt
          # dbterd lit le manifest.json généré juste avant
          # On filtre pour n'avoir que le modèle dimensionnel (ex: tables commençant par dim_ ou fct_)
          dbterd run --target mermaid --select "wildcard:dim_*,fct_*"
                
      # Partie pour créer un ERD (Entity Relation Diagram) des modèles
      - name: Create ERD HTML page
        run: |
          cd dbt
          # fichier HTML avec Mermaid.js pour afficher le diagramme
          echo '<!DOCTYPE html>
          <html>
          <body>
            <script type="module">
              import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
              mermaid.initialize({ startOnLoad: true });
            </script>
            <div class="mermaid">
          ' > target/erd.html
          
          # On injecte le contenu généré par dbterd
          cat target/output.md >> target/erd.html
          
          # On ferme les balises HTML
          echo '
            </div>
          </body>
          </html>' >> target/erd.html
      
      - name: Prepare documentation for GitHub Pages
        run: |
          mkdir -p public
          cp dbt/target/index.html public/
          cp dbt/target/manifest.json public/
          cp dbt/target/catalog.json public/
          cp dbt/target/graph.gpickle public/ 2>/dev/null || true
          cp dbt/target/erd.html public/erd.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

